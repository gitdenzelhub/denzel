name: Deploy to GitHub Pages

# index.html is generated from content.md, so the site is rebuilt here on
# every push. That keeps content.md the single source of truth — editing it
# (even from GitHub's web editor) is enough to update the live site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render index.html from content.md
        run: python build.py

      - name: Stage the files the site actually needs
        run: |
          mkdir -p _site
          cp index.html styles.css main.js _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
