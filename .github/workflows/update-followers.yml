name: Weekly follower count

# Reads the Instagram follower count every Monday, writes it into
# content.md, and redeploys the site if it changed. The page never shows
# fewer than `followers-minimum`, so a dip does not move the number.
#
# Instagram often refuses requests from GitHub's servers. For a reliable
# read, add an Instagram API access token as a repository secret named
# IG_ACCESS_TOKEN (Settings → Secrets and variables → Actions). Without
# it, a refused week just leaves the count as it was.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, 10:00 in Dubai
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the follower count
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/update_followers.py --auto --no-push

      - name: Commit and redeploy if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet content.md; then
            echo "No change."
            exit 0
          fi
          python build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.md index.html
          git commit -m "Weekly follower count update"
          git push
          # Pushes made with the workflow token do not trigger other
          # workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
